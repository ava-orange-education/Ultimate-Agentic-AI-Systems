services:
  redis:
    # Same Redis as Chapter 8. If you already have the container running from
    # that chapter, docker will reuse it and this block is a no-op.
    image: redis:7-alpine
    container_name: ch9-redis
    ports:
      - "6379:6379"

  neo4j:
    # 5.26 is the Neo4j LTS (supported until 2028). Vector indexes reached
    # GA in Neo4j 5.13. The LTS pin gets us a version that will still be
    # receiving security patches through the chapter's shelf life.
    image: neo4j:5.26-community
    container_name: ch9-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt driver
    environment:
      # Chapter default password. Change it before this compose file goes
      # anywhere other than a laptop.
      NEO4J_AUTH: neo4j/agentic-ai-book
      # APOC is not required for vector search itself, but the retrievers
      # can use apoc.* procedures on the retrieval_query side, so we switch
      # it on now to save a restart later.
      NEO4J_PLUGINS: '["apoc"]'
      # Enough heap for a small graph and a vector index. Adjust if you
      # plan to load a full retail catalog in Chapter 16.
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
